spring.application.name=edubridge-bd
server.port=${PORT:8080}

# ---- MongoDB (set MONGODB_URI in production; never commit real credentials) ----
spring.mongodb.uri=mongodb+srv://project:aENsrRvK5fo7HPn0@ir22.wh34bcz.mongodb.net/edubridge?appName=Ir22
spring.data.mongodb.auto-index-creation=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ---- Sessions / cookies ----
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Profile: "dev" loads sample data + a dev admin. Use SPRING_PROFILES_ACTIVE=prod when deploying ----
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- First admin account (created at startup if it does not exist yet) ----
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Profile picture uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Document vault upload limits
app.upload.max-document-size=5MB
app.upload.directory=${UPLOAD_DIR:uploads}

# Email reminders are enabled only when SMTP credentials are configured
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@edubridge.local}

# Optional AI ranking. Without an API key, transparent local ranking is used.
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}

# Operational health endpoint; keep other actuator endpoints private.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
