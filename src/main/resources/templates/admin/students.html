<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: adminHead('Student accounts')}"></head><body class="eb-admin"><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-4"><h1 class="h2">Student accounts</h1><p class="text-muted">Read-only overview of registered student accounts. Passwords and credentials are never displayed.</p><div class="eb-panel" th:if="${#lists.isEmpty(students)}">No student accounts yet.</div><div class="table-responsive eb-panel p-0" th:if="${!#lists.isEmpty(students)}"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>University</th><th>Study level</th><th>Joined</th></tr></thead><tbody><tr th:each="s : ${students}"><td th:text="${s.fullName}">Student</td><td th:text="${s.email}">email</td><td th:text="${s.university != null ? s.university : '—'}">—</td><td th:text="${s.studyLevel != null ? s.studyLevel : '—'}">—</td><td th:text="${s.createdAt != null ? #temporals.format(s.createdAt,'dd MMM yyyy') : '—'}">Date</td></tr></tbody></table></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
