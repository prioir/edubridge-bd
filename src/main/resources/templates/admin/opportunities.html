<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: adminHead('Manage opportunities')}"></head>
<body class="eb-admin">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container mt-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0 admin-page-title">Manage opportunities</h1>
        <a class="btn btn-primary" th:href="@{/admin/opportunities/new}">+ Add opportunity</a>
    </div>

    <div class="eb-panel p-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Deadline</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(opportunities)}">
                        <td colspan="5" class="text-center text-muted py-4">No opportunities yet. Add the first one.</td>
                    </tr>
                    <tr th:each="o : ${opportunities}">
                        <td>
                            <div class="fw-semibold" th:text="${o.title}">Title</div>
                            <div class="small text-muted" th:text="${o.organizationName}">Org</div>
                        </td>
                        <td th:text="${o.category.displayName}">Category</td>
                        <td>
                            <span th:text="${#temporals.format(o.deadline, 'dd MMM yyyy')}">01 Jan 2026</span>
                            <span th:if="${o.expired}" class="badge text-bg-secondary">Expired</span>
                        </td>
                        <td>
                            <span th:if="${o.published}" class="badge text-bg-success">Published</span>
                            <span th:unless="${o.published}" class="badge text-bg-warning">Draft</span>
                            <span th:if="${o.verified}" class="badge text-bg-light border">Verified</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/admin/opportunities/{id}/edit(id=${o.id})}">Edit</a>

                            <form method="post" class="d-inline"
                                  th:action="@{/admin/opportunities/{id}/publish(id=${o.id})}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary"
                                        th:text="${o.published} ? 'Unpublish' : 'Publish'">Publish</button>
                            </form>

                            <!-- The browser asks "OK / Cancel" before the form is sent -->
                            <form method="post" class="d-inline"
                                  th:action="@{/admin/opportunities/{id}/delete(id=${o.id})}"
                                  onsubmit="return confirm('Delete this opportunity permanently? Student tracking records for it will also be removed.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
