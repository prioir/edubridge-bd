<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: adminHead('Admin audit log')}"></head><body class="eb-admin"><nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-4"><h1 class="h2">Admin audit log</h1><p class="text-muted">Recent administrative changes to opportunities.</p><div class="eb-panel" th:if="${#lists.isEmpty(events)}">No audit events have been recorded yet.</div><div class="table-responsive eb-panel p-0" th:if="${!#lists.isEmpty(events)}"><table class="table table-striped align-middle mb-0"><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody><tr th:each="e : ${events}"><td th:text="${#temporals.format(e.createdAt,'dd MMM yyyy HH:mm')}">Time</td><td th:text="${e.actorEmail}">admin</td><td><span class="badge text-bg-light border" th:text="${e.action}">ACTION</span></td><td th:text="${e.targetId}">ID</td><td th:text="${e.details}">Details</td></tr></tbody></table></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
