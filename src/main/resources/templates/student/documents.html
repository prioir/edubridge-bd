<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Private document vault')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: flash}"></div><div class="mb-4"><h1 class="h2">Private document vault</h1><p class="text-muted">Keep your CV, transcript and application documents together. PDF, JPG and PNG · Maximum 5 MB per file.</p></div>
<form class="eb-panel mb-4" method="post" enctype="multipart/form-data" th:action="@{/student/documents}"><label for="file" class="form-label fw-semibold">Upload a document</label><div class="d-flex flex-wrap gap-2"><input class="form-control" type="file" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required><button class="btn btn-primary" type="submit">Upload securely</button></div></form>
<div class="eb-panel" th:if="${#lists.isEmpty(documents)}"><h2 class="h5">No documents yet</h2><p class="text-muted mb-0">Uploaded documents will be visible only to your own account.</p></div>
<div class="table-responsive eb-panel p-0" th:if="${!#lists.isEmpty(documents)}"><table class="table align-middle mb-0"><thead><tr><th>Filename</th><th>Type</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody><tr th:each="d : ${documents}"><td th:text="${d.originalFilename}">CV.pdf</td><td th:text="${d.contentType}">PDF</td><td th:text="${#numbers.formatDecimal(d.size / 1024.0,1,1)} + ' KB'">0 KB</td><td th:text="${#temporals.format(d.uploadedAt,'dd MMM yyyy')}">Date</td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/student/documents/{id}/download(id=${d.id})}">Download</a><form method="post" th:action="@{/student/documents/{id}/delete(id=${d.id})}" onsubmit="return confirm('Permanently delete this document?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></div></td></tr></tbody></table></div></main>
<footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
