<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="eb-auth-card mx-auto">
        <h1 class="h4 mb-3">Welcome back</h1>

        <div th:replace="~{fragments/layout :: flash}"></div>
        <div th:if="${param.error}" class="alert alert-danger">Wrong email or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="email" id="username" name="username" class="form-control" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p class="small text-center mt-3 mb-0">
            New here? <a th:href="@{/register}">Create a student account</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
